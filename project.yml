name: YuanRead

options:
  bundleIdPrefix: ltd.lcc1107
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"

targets:
  YuanRead:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ltd.lcc1107.yuanread
        PRODUCT_NAME: YuanRead
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ONLY_ACTIVE_ARCH: "YES"

  YuanReadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: YuanRead
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ltd.lcc1107.yuanread.uitests
        TEST_TARGET_NAME: YuanRead
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        ONLY_ACTIVE_ARCH: "YES"

schemes:
  YuanRead:
    build:
      targets:
        YuanRead: all
        YuanReadUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YuanReadUITests
