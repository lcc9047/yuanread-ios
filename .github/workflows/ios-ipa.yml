name: ios-build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-run-on-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          echo "--- runtimes ---"
          xcrun simctl list runtimes
          echo "--- devices ---"
          xcrun simctl list devices available | head -40

      - name: Probe target site from runner
        run: |
          {
            echo "== curl https://lcc1107.ltd/ =="
            curl -s -o /dev/null -w 'status=%{http_code} time=%{time_total}s remote=%{remote_ip}\n' --max-time 25 https://lcc1107.ltd/ || echo "curl root failed"
            curl -s -o /dev/null -w 'status=%{http_code} time=%{time_total}s\n' --max-time 25 https://lcc1107.ltd/health || echo "curl health failed"
          } 2>&1 | tee site-probe.txt
          cat site-probe.txt

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          ls -la

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -E "^[[:space:]]+iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then echo "no iPhone simulator found"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -E "^[[:space:]]+iPhone" | head -5
          echo "picked=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Verify app icon made it into the bundle
        run: |
          set -euo pipefail
          echo "--- asset catalog sources ---"
          find Resources/Assets.xcassets -type f | sort
          echo "--- generated project resources ---"
          grep -c "Assets.xcassets" YuanRead.xcodeproj/project.pbxproj || true

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project YuanRead.xcodeproj \
            -scheme YuanRead \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-simulator.log | tail -40
          APP="build-sim/Build/Products/Debug-iphonesimulator/YuanRead.app"
          ls -la "$APP" || true
          echo "--- 图标是否真的打进 bundle ---"
          ls -la "$APP/AppIcon"* "$APP/Assets.car" 2>/dev/null || echo "(no AppIcon/Assets.car)"
          echo "--- Info.plist 关键键 ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' "$APP/Info.plist" || true

      - name: Install, launch and screenshot
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE=ltd.lcc1107.yuanread
          APP="build-sim/Build/Products/Debug-iphonesimulator/YuanRead.app"

          if ! xcrun simctl install "$UDID" "$APP"; then
            echo "install failed, retry with ad-hoc signature"
            codesign --force --sign - "$APP" || true
            xcrun simctl install "$UDID" "$APP"
          fi

          echo "=== ① 默认主题（paper）==="
          xcrun simctl launch "$UDID" "$BUNDLE" || echo "launch returned non-zero"
          sleep 6
          xcrun simctl io "$UDID" screenshot home-6s.png || echo "screenshot 1 failed"
          sleep 10
          xcrun simctl io "$UDID" screenshot home-16s.png || echo "screenshot 2 failed"

          echo "=== ② 深色主题（-themeOverride night）==="
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          sleep 2
          xcrun simctl launch "$UDID" "$BUNDLE" -themeOverride night || echo "launch(night) returned non-zero"
          sleep 14
          xcrun simctl io "$UDID" screenshot home-night.png || echo "screenshot 3 failed"

          echo "=== App 日志（壳自证的 chrome sync）==="
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "YuanRead"' > yuanread-sim.log || true
          grep "chrome sync" yuanread-sim.log | tail -8 || echo "(no chrome sync lines)"

          echo "=== 真闸门：paper 与 night 必须各自观察到一种页面背景色 ==="
          grep -o "bg=rgb([^)]*)" yuanread-sim.log | sort -u > backgrounds.txt || true
          cat backgrounds.txt
          DISTINCT=$(wc -l < backgrounds.txt | tr -d ' ')
          echo "distinct backgrounds = $DISTINCT"
          if [ "$DISTINCT" -lt 2 ]; then
            echo "::error::主题自适应验证失败：整轮只观察到 $DISTINCT 种页面背景色（期望 >= 2）—— 说明深色那轮没真正生效"
            exit 1
          fi
          ls -la *.png *.log backgrounds.txt 2>/dev/null || true

      - name: Upload simulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-run
          if-no-files-found: warn
          path: |
            home-6s.png
            home-16s.png
            home-night.png
            yuanread-sim.log
            backgrounds.txt
            uitest.log
            site-probe.txt
            build-simulator.log

      - name: XCUITest 交互路径（搜索 → 详情 → 目录 → 正文）
        run: |
          set -uo pipefail
          xcodebuild test \
            -project YuanRead.xcodeproj \
            -scheme YuanRead \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -resultBundlePath uitest-result.xcresult 2>&1 | tee uitest.log | tail -80

          echo "=== XCUITest 结果 ==="
          grep -E "Test Case .*(passed|failed)|\[XCUITest\]" uitest.log | tail -10 || true
          grep -E "error:|XCTAssert" uitest.log | tail -20 || true
          if grep -q "\*\* TEST FAILED \*\*" uitest.log; then
            echo "::error::XCUITest 未通过 —— 交互路径没走通（详见 artifact 里的 uitest.log）"
            exit 1
          fi

      - name: Build unsigned device ipa
        if: always()
        run: |
          set -euo pipefail
          xcodebuild \
            -project YuanRead.xcodeproj \
            -scheme YuanRead \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-device.log | tail -30

          APP="build-device/Build/Products/Release-iphoneos/YuanRead.app"
          ls -la "$APP"
          rm -rf Payload YuanRead-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry YuanRead-unsigned.ipa Payload
          shasum -a 256 YuanRead-unsigned.ipa | tee YuanRead-unsigned.ipa.sha256
          du -h YuanRead-unsigned.ipa

      - name: Upload unsigned ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuanread-ios-unsigned-ipa
          if-no-files-found: warn
          path: |
            YuanRead-unsigned.ipa
            YuanRead-unsigned.ipa.sha256
            build-device.log
